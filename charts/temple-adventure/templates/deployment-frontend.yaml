apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "temple-adventure.fullname" . }}-frontend
  labels:
    {{- include "temple-adventure.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/component: frontend
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Keep the replicas on separate nodes so draining one node rolls the frontend
      # instead of blacking it out. ScheduleAnyway, not a hard anti-affinity, so a pod is
      # still placeable when only one node is schedulable.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: frontend
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - containerPort: 80
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
---
# maxUnavailable rather than minAvailable: at 2 replicas `minAvailable: 2` would report
# disruptionsAllowed=0 and block a node drain forever instead of rolling one pod at a time.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "temple-adventure.fullname" . }}-frontend
  labels:
    {{- include "temple-adventure.labels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: frontend
